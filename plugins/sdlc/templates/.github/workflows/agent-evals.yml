# Auth — set ONE of these repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  Claude subscription (Pro/Max/Team/Enterprise): run `claude setup-token` locally, paste the token
#   ANTHROPIC_API_KEY        Claude Console API key
#   Bedrock                  uncomment the aws-actions block + CLAUDE_CODE_USE_BEDROCK
# Continuous evals: regression-test the agent's configuration like code.
# Required: repo variable SDLC_MARKETPLACE = <owner>/<repo of the ai-native-sdlc kit>
name: Agent evals
on:
  pull_request:
    paths: ['CLAUDE.md', 'REVIEW.md', '.claude/**', 'evals/**', '.sdlc/config.json']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Bedrock OIDC

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # --- Bedrock (uncomment, and drop ANTHROPIC_API_KEY below) ---
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with: { role-to-assume: '${{ vars.AWS_ROLE_ARN }}', aws-region: '${{ vars.AWS_REGION }}' }
      - name: Install Claude Code + sdlc plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add "${{ vars.SDLC_MARKETPLACE }}"
          claude plugin install sdlc@ai-native-sdlc
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CLAUDE_CODE_USE_BEDROCK: '1'
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          git config user.name "sdlc-evals"; git config user.email "evals@users.noreply.github.com"
          python .sdlc/bin/evals.py --json eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: eval-results.json }
